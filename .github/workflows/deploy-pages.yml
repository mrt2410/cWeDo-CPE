name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # all tags, so the newest release can be picked out for the site root
          fetch-depth: 0

      - name: Build static site
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -L index.html "$site/index.html"
          cp -r css "$site/css"
          cp -r js "$site/js"
          cp -r data "$site/data"
          # recipes page: regenerate the manifest it uses for auto-discovery, then ship the folder
          node scripts/build-recipes-manifest.js
          cp -r recipes "$site/recipes"

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"

          # releases go to v/<tag>/, the main branch to v/main/
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            dest="v/$GITHUB_REF_NAME"
          else
            dest="v/main"
          fi
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # one-time move of the old top-level /vX.Y.Z/ folders into v/
          shopt -s nullglob
          for old in v[0-9]*/; do
            mkdir -p v
            mv "${old%/}" "v/${old%/}"
          done
          shopt -u nullglob
          rm -f versions.html

          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r "$site/." "$dest/"

          # the site root mirrors the newest release; a branch push or an older tag leaves it alone
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" = "$latest" ]; then
            rm -rf index.html css js data recipes
            cp -r "$site/." .
          fi

          touch .nojekyll

          {
            echo "<!DOCTYPE html>"
            echo "<html lang=\"en\"><head><meta charset=\"utf-8\">"
            echo "<title>cWeDo CPE — versions</title></head><body>"
            echo "<h1>cWeDo CPE — versions</h1>"
            echo "<p><a href=\"../\">Latest release</a></p>"
            echo "<ul>"
            echo "  <li><a href=\"main/\">main</a></li>"
            for name in $(ls -1 v | sort -Vr); do
              [ -d "v/$name" ] || continue
              [ "$name" = "main" ] && continue
              echo "  <li><a href=\"$name/\">$name</a></li>"
            done
            echo "</ul></body></html>"
          } > v/index.html

          git add -A
          git commit -m "Publish $GITHUB_REF_NAME" --allow-empty
          git push origin gh-pages
